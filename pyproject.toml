[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidefend-mcp"
version = "1.3.0"
description = "Local RAG service for AIDEFEND AI security knowledge base with dual-mode support (REST API + MCP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Edward Lee"}
]
maintainers = [
    {name = "Edward Lee"}
]
keywords = [
    "ai-security",
    "rag",
    "vector-search",
    "mcp",
    "model-context-protocol",
    "aidefend",
    "prompt-injection",
    "ai-defense",
    "lancedb",
    "fastembed"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.4.1",
    "uvicorn[standard]==0.52.1",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "lancedb==0.25.3",
    "pyarrow>=16",
    "pandas>=2.0.0",
    "numpy>=1.24,<3",
    "fastembed==0.8.0",
    "pillow==12.3.0",
    "onnxruntime>=1.17.0,!=1.20.0,<1.24; python_version == '3.10'",
    "onnxruntime>=1.17.0,!=1.20.0,!=1.24.0,!=1.24.1; python_version >= '3.11' and python_version < '3.13'",
    "onnxruntime>1.21.0,!=1.24.0,!=1.24.1; python_version == '3.13'",
    "onnxruntime>=1.24.2; python_version >= '3.14'",
    "mcp==1.29.0",
    "anyio==4.14.2",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "typing-extensions==4.16.0",
    "beautifulsoup4==4.15.0",
    "rapidfuzz==3.14.5",
    "aiorwlock==1.5.1",
    "pywin32==312; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx2==2.9.1",
    "black==26.5.1",
    "flake8==7.3.0",
    "mypy==1.14.1",
    "isort==5.13.2",
    "bandit==1.9.4",
    "safety==3.8.1",
    "pip-audit==2.10.1",
    "cryptography==50.0.0",
    "packaging==26.3",
    "tokenizers>=0.15,<1.0",
    "tomli==2.4.1; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/edward-playground/aidefend-mcp"
Documentation = "https://github.com/edward-playground/aidefend-mcp#readme"
Repository = "https://github.com/edward-playground/aidefend-mcp"
"Bug Tracker" = "https://github.com/edward-playground/aidefend-mcp/issues"
Changelog = "https://github.com/edward-playground/aidefend-mcp/blob/main/CHANGELOG.md"

[project.scripts]
aidefend-mcp = "app.cli:main"

[tool.setuptools]
# mcp_server is a top-level module (not under app/), so it must be listed explicitly.
# __main__ is intentionally NOT packaged: a top-level module named __main__ collides with the
# console-script launcher at import time. The repo-root __main__.py shim is only for the
# source-checkout `python __main__.py` flow.
py-modules = ["mcp_server"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.md"]

# NOTE: node_modules/ is gitignored and absent from a fresh clone / sdist, so it must NOT be
# referenced here — doing so makes `pip install .` and `python -m build` fail with
# The parser imports the pinned Acorn runtime from vendor/. The parser, runtime,
# and upstream license are installed as data files so wheels work without a
# post-install npm operation. Node.js itself remains a runtime dependency.
[tool.setuptools.data-files]
"." = ["parse_js_module.mjs", "package.json", "package-lock.json", "LICENSE", "THIRD_PARTY_CONTENT.md"]
"vendor" = ["vendor/acorn.mjs", "vendor/ACORN-LICENSE", "vendor/README.md"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | data
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["data/*", ".venv/*", "build/*", "dist/*"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "current_snapshot: pins the exact 2026-08-05 local AIDEFEND snapshot; rolling CI deselects it"
]

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true
pretty = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "fastembed.*",
    "mcp.*",
    "slowapi.*"
]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/data/*"
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod"
]

# Bandit security checker configuration
[tool.bandit]
exclude_dirs = ["tests", "data", ".venv", "build", "dist"]
skips = ["B101"]  # Skip assert_used check (used in tests)
